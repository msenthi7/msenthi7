name: Refresh profile

on:
  schedule:
    - cron: "17 13 * * 1"  # Mondays, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.toml", "scripts/**", "tests/**"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Write this week's lab-notebook entry
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: without it the deterministic writer runs
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet "anthropic>=1.15"
          python scripts/lab_notebook.py

      - name: Rebuild README and figures
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Refresh profile: lab notebook and figures"
          git push
