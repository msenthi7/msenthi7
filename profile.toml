# ── Inductive biases: the priors behind every system above ───────────────────
[[biases]]
prior    = "Ground, then generate"
practice = "Retrieve first and answer only from what was retrieved. ClinIQ's system prompt forbids outside knowledge for medical answers."
evidence = "ClaudeHack"

[[biases]]
prior    = "The LLM is a sensor, not the model"
practice = "Claude returns one bounded score from Fed language; it shifts the Vasicek mean-reversion speed by −40 % to +50 %, and the SDE, Monte Carlo and VaR stay deterministic and auditable."
evidence = "Quant_LLM"

[[biases]]
prior    = "Deterministic core, generative surface"
practice = "Patients are ranked by a transparent point-based severity score; the LLM writes the summaries, never the ranking."
evidence = "ClaudeHack"

[[biases]]
prior    = "Fail closed"
practice = "Every structured LLM call is parsed with fallback defaults; this profile's agent retries once, then falls back to a summary it can't get wrong."
evidence = "msenthi7"

[[biases]]
prior    = "Sensitive data stays local"
practice = "Medical Q&A runs on Ollama + Chroma on the machine, so protected health information never reaches a third party."
evidence = "RAG_using_Mistral_ChromaDB"

[[biases]]
prior    = "Specialists over a monolith"
practice = "One orchestrating model, seven MCP servers, each owning exactly one job."
evidence = "TravelGenie"

