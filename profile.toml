# The hero animation "decodes" this answer token by token.
# {chosen|runner-up|third} marks a token the model visibly samples: the
# first option is emitted, the others are shown as lower-probability candidates.
[hero]
prompt = "who is msenthi7?"
answer = "Hi, I'm Matheshwara, an {ML|AI|applied-ML} engineer who {builds|ships|designs} {grounded|reliable|auditable} LLM systems: {clinical|medical|patient} triage with strict RAG, {Fed-sentiment|LLM-scored|stochastic} risk models, and agents that {retrieve|verify|cite} before they speak."

# Extra prompts for the interactive playground (docs/index.html). Same {a|b|c}
# syntax; every candidate must be true, because visitors can sample any of them.
[[playground.prompts]]
prompt = "what has msenthi7 built?"
answer = "ClinIQ, a {grounded|local-LLM|RAG-backed} triage assistant for under-resourced clinics, built at the Anthropic Hackathon; Sentimental Liquidity, where Claude {scores|reads|grades} Fed statements to steer a Vasicek rate model; and medical RAG that keeps patient data {on the machine|local|private}."

[[playground.prompts]]
prompt = "what research has msenthi7 done?"
answer = "An IEEE paper on {160 GHz|D-band|millimetre-wave} traveling-wave-tube amplifiers, a patented IoT wearable for toddler safety, and, as a data scientist at the UMD Counseling Center, a {campus-wide|2025} study of food access and student well-being plus an APA 2026 poster comparing {ChatGPT|AI} with human researchers."

[[playground.prompts]]
prompt = "is msenthi7 open to work?"
answer = "Yes: {ML|AI|applied-ML} engineering roles and research collaborations, especially where AI {has to be right|must be grounded|is high-stakes}: healthcare, finance and safety."

# Shown under the hero, written like a paper abstract.
[abstract]
text = """We present *matheshwara-v2026*, a human model pre-trained on electronics and signals \
(one IEEE paper, one patent) and fine-tuned on machine learning at the University of Maryland. \
It specialises in **grounded LLM systems**: a clinical-triage assistant built at the Anthropic Hackathon, \
a stress-testing framework in which Claude reads Fed language to steer a stochastic rate model, \
and retrieval pipelines that keep patient data on the machine. \
As a data scientist at the UMD Counseling Center Research Unit, it co-authored a campus-wide study of \
food access and student well-being and an APA 2026 poster comparing ChatGPT with human researchers. \
This README is itself an experiment: an LLM agent writes its lab notebook every week, \
and a grounding check rejects anything it can't trace to real activity."""

[card]
rows = [
  ["Model",             "`matheshwara-v2026`"],
  ["Pre-training",      "Electronics & signals: an [IEEE UCMMT 2021 paper](https://ieeexplore.ieee.org/document/9569897) on D-band (160 GHz) traveling-wave-tube amplifiers and an [IoT patent](https://github.com/msenthi7/Research-and-Publications/tree/main/Patent)"],
  ["Fine-tuning",       "Machine learning & data science at the University of Maryland"],
  ["Deployment",        "Data Scientist, [UMD Counseling Center Research Unit](https://counseling.umd.edu/about-us/research-unit): campus-wide survey research on food access and student well-being, presented to the Vice President of Student Affairs and at the [Maryland Student Affairs Conference](https://msac.umd.edu/conference-program/sessions)"],
  ["Specialisation",    "Grounded LLM systems: retrieval, tool-using agents, and LLMs as bounded signals inside quantitative models"],
  ["Intended use",      "AI that has to be right: healthcare, finance, safety"],
  ["Out of scope",      "Hallucinated medical advice. [ClinIQ](https://github.com/msenthi7/ClaudeHack) answers only from retrieved context"],
  ["Eval highlights",   "R² 0.918 on EV range · MAD 1.279 on book ratings · 1,000-path Monte Carlo VaR / CVaR"],
  ["Known limitations", "Overfits to hard problems. Will refactor your notebook into a pipeline."],
  ["Status",            "Open to ML / AI engineering roles and research collaborations"],
]

# ── Attention map ────────────────────────────────────────────────────────────
# Rows (queries) are domains, columns (keys) are methods. Each cell is a
# row-wise softmax over how many projects in that domain use that method,
# so the heatmap is computed from the `uses` tags on the projects below.
[attention]
temperature = 1.0
domains = ["Clinical AI", "Quant finance", "Agentic tools", "Applied ML"]
keys = [
  ["retrieval",  "Retrieval / RAG"],
  ["llm_api",    "LLM APIs"],
  ["local_llm",  "Local LLMs"],
  ["agents",     "Agents / MCP"],
  ["guardrails", "Guardrails"],
  ["stochastic", "Stochastic sim"],
  ["classical",  "Classical ML"],
  ["mlops",      "MLOps / cloud"],
  ["data_eng",   "Data pipelines"],
]

# ── Experiments ──────────────────────────────────────────────────────────────
# `featured` projects become cards; the rest go under "more runs".
# Run ids (exp-01, exp-02, …) are assigned in `date` order by the build.

[[projects]]
name     = "ClinIQ"
repo     = "ClaudeHack"
date     = "2026-04"
domain   = "Clinical AI"
featured = true
question = "Can a local LLM help an under-resourced clinic triage patients without inventing medical facts?"
method   = "Transparent rule-based severity score → llama3.1 (Ollama) clinical and plain-language summaries → strict RAG over ChromaDB (Gale Encyclopedia + openFDA labels) → 3-step prescription-safety check"
result   = "Built for the Anthropic Hackathon (Health & Wellbeing). Chat answers only from retrieved chunks; AI features disable themselves if the knowledge base is missing"
uses     = ["retrieval", "local_llm", "guardrails", "agents", "data_eng"]

[[projects]]
